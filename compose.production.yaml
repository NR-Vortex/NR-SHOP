x-app: &app
  image: nr-shop:local
  build: .
  env_file: .env
  environment:
    DB_HOST: postgres
    DB_PORT: "5432"
    NR_SHOP_DATA_DIR: /data
  volumes:
    - app_data:/data

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: nr_shop
      POSTGRES_USER: nr_shop_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "nr_shop_user", "-d", "nr_shop"]
      interval: 5s
      timeout: 5s
      retries: 12
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
  bot:
    <<: *app
    command: ["python", "main.py"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
  miniapp:
    <<: *app
    command: ["python", "-m", "api.miniapp"]
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      NR_SHOP_DATA_DIR: /data
      MINIAPP_BIND: 0.0.0.0
    depends_on:
      migrate:
        condition: service_completed_successfully
  https:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    environment:
      MINIAPP_DOMAIN: ${MINIAPP_DOMAIN:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [miniapp]

volumes:
  postgres_data:
  app_data:
  caddy_data:
