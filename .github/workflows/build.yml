name: Build installer image
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n install.sh && bash -n scripts/enable-updates.sh
      - run: python3 -m py_compile scripts/update_host.py core/releases.py
      - run: docker build -t nr-shop:ci .
      - run: docker run --rm -e BOT_TOKEN=123456:example -e POSTGRES_PASSWORD=example nr-shop:ci python -c 'from api.miniapp import create_app; create_app()'
