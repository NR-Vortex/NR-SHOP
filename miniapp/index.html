<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101019">
<title>پنل نمایندگی | NR SHOP</title>
<link rel="stylesheet" href="agency.css">
<script defer src="launch.js"></script>
<script defer src="agency.js"></script>
</head>
<body>
<header><div class="bar"><button id="menu" aria-label="باز کردن منوی نمایندگی" aria-controls="drawer">☰</button><b dir="ltr">NR<span>/</span>SHOP</b><small id="mode">پنل نمایندگی</small></div></header>
<main>
<p id="hello" class="eyebrow">پنل نمایندگی</p>
<h1 id="heading">میز کار نماینده</h1>
<p id="notice" role="status"></p>
<section id="home">
<div class="hero"><div class="rings" aria-hidden="true"></div><div class="hero-content"><p>حجم آمادهٔ تخصیص</p><strong id="volume">—</strong> <small>گیگابایت</small><div><button data-act="buy">＋ خرید حجم</button></div></div></div>
<div class="cards"><article><small>موجودی کیف پول</small><strong id="wallet">—</strong></article><article><small>تعرفهٔ هر گیگابایت</small><strong id="rate">—</strong></article></div>
<button class="issue" data-act="connect"><span>＋</span><div><b>ساخت کانفیگ</b><small>تخصیص حجم از سهمیهٔ نمایندگی</small></div><i>‹</i></button>
<div class="section-title"><h2>سرویس‌های اخیر</h2><button data-tab="services">تاریخچه ‹</button></div><div class="panel" id="recent"></div>
</section>
<section id="services" hidden>
<label for="search">جست‌وجو در سرویس‌های بارگذاری‌شده</label><input type="search" id="search" placeholder="شناسهٔ سرویس یا مشتری">
<div class="filters"><button data-filter="all">همه</button><button data-filter="done">تحویل‌شده</button><button data-filter="wait">در انتظار</button></div>
<div class="panel" id="list"></div><button id="more" hidden>نمایش سرویس‌های قدیمی‌تر</button>
</section>
<section id="account" hidden><div class="panel"><small>حساب نمایندگی</small><h2 id="accountBot">—</h2><p>کانفیگ‌ها روی پنل مرکزی ساخته می‌شوند. حجم هر کانفیگ از سهمیهٔ همین حساب کم می‌شود.</p></div></section>
</main>
<nav aria-label="دسترسی سریع"><button data-tab="home"><span>⌂</span>میز کار</button><button data-tab="services"><span>▤</span>سرویس‌ها</button><button data-tab="account"><span>◎</span>حساب من</button></nav>
<dialog id="drawer"><div class="section-title"><h2>پنل نمایندگی</h2><button data-close aria-label="بستن منو">×</button></div><button data-tab="home">میز کار</button><button data-tab="services">سرویس‌های من</button><button data-tab="account">حساب نمایندگی</button><a id="shopEntry" href="shop.html">فروشگاه مشتری ‹</a><a hidden id="adminEntry" href="admin.html">مدیریت فروشگاه ‹</a></dialog>
<dialog id="confirm"><h2 id="dialogTitle"></h2><div id="estimate"><label for="gb">برآورد هزینه بر اساس حجم (گیگابایت)</label><input id="gb" type="number" min="1" max="999999" value="10"><p id="total"></p></div><p id="details"></p><button id="continue">ادامه در ربات</button> <button data-close id="dismiss">بستن</button></dialog>
</body></html>
