<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>مدیریت NR SHOP</title>
<style>
:root{--primary:#c7ef7c;--secondary:#323f2d;--ptext:#142215;--stext:#fff;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101511;color:#edf2e8;font:15px/1.8 Tahoma,Arial,sans-serif}main{max-width:790px;margin:auto;padding:20px 18px 90px}header,.bar,.presets{display:flex;align-items:center;gap:12px}header{justify-content:space-between;border-bottom:1px solid #344036;padding-bottom:15px}header strong{font:900 22px Arial;letter-spacing:-1px}header i{color:var(--primary)}header span,small{color:#b5c5b4}.bar{margin:18px 0;flex-wrap:wrap}h1{font-size:clamp(23px,5vw,34px);margin:20px 0}h2{font-size:18px}button,a.btn{font:inherit;font-weight:bold;cursor:pointer;border:0;border-radius:12px;background:var(--secondary);color:var(--stext);padding:10px 15px;text-decoration:none}.primary{background:var(--primary);color:var(--ptext)}button:disabled{opacity:.6;cursor:wait}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #87bdff;outline-offset:2px}.surface{background:#1b231d;border:1px solid #354138;border-radius:20px;padding:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.grid button{text-align:right;overflow-wrap:anywhere;min-height:48px}.body{white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 16px}textarea,input,select{font:inherit;border:1px solid #59685a;background:#111913;color:white;border-radius:9px;padding:8px;width:100%}label{display:block;margin:12px 0 5px}input[type=color]{height:48px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}.presets{flex-wrap:wrap}.presets button{height:34px;width:34px;border:2px solid #a8aea5;border-radius:50%;padding:0}.note{color:#d8edab;white-space:pre-line}img{max-width:100%;max-height:55vh}button[aria-pressed=true]{box-shadow:inset 0 -3px var(--primary)}[hidden]{display:none!important}@media(max-width:350px){.grid,.pair{grid-template-columns:1fr}}
</style></head><body><main><header><span id="session">پنل ادمین</span><strong dir="ltr">NR<i>/</i>SHOP</strong></header>
<div class="bar"><button id="home">مدیریت فروشگاه</button><button id="palette">رنگ دکمه‌ها</button></div>
<h1 id="title">مدیریت فروشگاه</h1><section id="operations" class="surface"><p id="caption" class="body"></p><div id="media"></div><div id="buttons" class="grid"></div>
<form id="form" hidden><label for="value">پاسخ شما</label><textarea id="value" rows="3"></textarea><input id="secret" type="password" hidden autocomplete="new-password" aria-label="رمز پنل"><input id="upload" type="file" hidden aria-label="پیوست پاسخ"><div class="bar"><button class="primary">ارسال</button></div></form></section>
<section id="appearance" class="surface" hidden><h2>ظاهر مینی‌اپ</h2><div class="pair"><label>دکمه اصلی<input id="primary" type="color"></label><label>دکمه‌های منو<input id="secondary" type="color"></label></div><p>پالت‌های آماده</p><div class="presets" id="presets"></div><h2>دکمه‌های داخل چت تلگرام</h2><select id="native" aria-label="رنگ دکمه تلگرام"><option value="default">پیش‌فرض تلگرام</option><option value="primary">آبی</option><option value="success">سبز</option><option value="danger">قرمز</option></select><div class="bar"><button class="primary" id="save">ذخیره رنگ‌ها</button><button id="reset">بازگرداندن رنگ اولیه</button></div></section><p id="notice" class="note" role="status"></p></main>
<script>
const $=id=>document.getElementById(id),defaults={primary:'#c7ef7c',secondary:'#323f2d',native:'default'};
let tg,screen,busy=false,saved=defaults,blob,preview=location.protocol==='file:';
function contrast(hex){const rgb=hex.slice(1).match(/../g).map(x=>parseInt(x,16)/255).map(x=>x<=.04045?x/12.92:((x+.055)/1.055)**2.4);return .2126*rgb[0]+.7152*rgb[1]+.0722*rgb[2]>.179?'#101510':'#fff'}
function apply(t){for(const [k,c] of [['primary','ptext'],['secondary','stext']]){document.documentElement.style.setProperty('--'+k,t[k]);document.documentElement.style.setProperty('--'+c,contrast(t[k]));$(k).value=t[k]}$('native').value=t.native}
function chosen(){return {primary:$('primary').value,secondary:$('secondary').value,native:$('native').value}}
for(const k of ['primary','secondary'])$(k).oninput=()=>apply(chosen());
for(const [label,p,s] of [['زیتونی','#c7ef7c','#323f2d'],['آبی','#83b9ff','#263954'],['بنفش','#c2a2ff','#423452'],['کهربایی','#ffc475','#513c27']]){const b=document.createElement('button');b.ariaLabel=label;b.title=label;b.style.background=p;b.onclick=()=>apply({...chosen(),primary:p,secondary:s});$('presets').append(b)}
async function request(url,opts={}){const res=await fetch(url,{...opts,headers:{Authorization:'tma '+tg.initData,...opts.headers},cache:'no-store'});if(!res.ok)throw Error(res.status===403?'دسترسی این بخش فقط برای مدیر است.':res.status===401?'از منوی ربات دوباره وارد شوید.':res.status===409?'صفحه تغییر کرده است. دوباره انتخاب کنید.':'عملیات تکمیل نشد؛ وضعیت را بررسی کنید.');return res}
function themeTab(on){$('operations').hidden=on;$('appearance').hidden=!on;$('title').textContent=on?'رنگ دکمه‌ها':'مدیریت فروشگاه';$('notice').textContent='';$('palette').setAttribute('aria-pressed',on);$('home').setAttribute('aria-pressed',!on)}
async function render(v){screen=v;$('caption').textContent=v.caption;$('notice').textContent=v.notice||'';$('buttons').replaceChildren();for(const row of v.rows)for(const item of row){const b=document.createElement('button');b.textContent=item.text;b.onclick=()=>eventToServer(item.action);$('buttons').append(b)}$('form').hidden=!v.input;$('value').hidden=!!v.password;$('secret').hidden=!v.password;$('upload').hidden=!v.upload;$('upload').value='';$('value').value='';$('secret').value='';$('media').replaceChildren();if(blob)URL.revokeObjectURL(blob);if(v.media){blob=URL.createObjectURL(await (await request('api/admin/media/'+v.media.key)).blob());const node=document.createElement(v.media.photo?'img':'a');if(v.media.photo){node.src=blob;node.alt='تصویر رسید'}else{node.href=blob;node.download='receipt';node.textContent='دریافت فایل رسید';node.className='btn'}$('media').append(node)}}
async function refresh(){await render(await (await request('api/admin/screen')).json())}
async function eventToServer(action){if(busy)return;if(preview){$('notice').textContent='عملیات مدیریتی با ورود ادمین از تلگرام فعال می‌شود.';return}busy=true;try{const body=new FormData();body.set('revision',screen.revision);body.set('action',action);if(action==='input'){body.set('value',screen.password?$('secret').value:$('value').value);if($('upload').files[0])body.set('file',$('upload').files[0])}await render(await (await request('api/admin/event',{method:'POST',body})).json())}catch(e){try{await refresh()}catch{}$('notice').textContent=e.message}finally{busy=false}}
$('form').onsubmit=e=>{e.preventDefault();eventToServer('input')};$('palette').onclick=()=>{apply(saved);themeTab(true)};$('home').onclick=()=>{themeTab(false);apply(saved);if(!preview&&screen)eventToServer('home')};$('reset').onclick=()=>apply(defaults);
$('save').onclick=async()=>{try{const t=chosen();if(preview){localStorage.setItem('nr-preview-theme',JSON.stringify(t))}else{await request('api/admin/theme',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(t)})}saved=t;$('notice').textContent=preview?'رنگ پیش‌نمایش ذخیره شد.':'رنگ‌ها ذخیره شدند.'}catch(e){$('notice').textContent=e.message}};
(async()=>{try{if(preview){saved=JSON.parse(localStorage.getItem('nr-preview-theme')||'null')||defaults;$('session').textContent='پیش‌نمایش';const labels=['کاربران','گزارش‌ها','بخش AI','مدیریت VPN','پنل نمایندگی','ربات نمایندگی','امور مالی','پشتیبانی','هدایا','راهنما','پیام همگانی','مدیریت متن‌ها','مدیریت نمایندگان','دیتابیس','تبلیغات','تنظیمات'];await render({caption:'بخش موردنظر را انتخاب کنید.',rows:[labels.map(text=>({text}))]})}else{await new Promise((ok,fail)=>{const sdk=document.createElement('script');sdk.src='https://telegram.org/js/telegram-web-app.js';sdk.onload=ok;sdk.onerror=()=>fail(Error('اتصال به تلگرام برقرار نشد.'));document.head.append(sdk)});tg=window.Telegram.WebApp;tg.ready();tg.expand();if(!tg.initData)throw Error('از منوی ادمین ربات وارد شوید.');await refresh();saved=screen.theme;tg.BackButton.show();tg.BackButton.onClick(()=>$('home').click())}apply(saved)}catch(e){$('notice').textContent=e.message;$('palette').disabled=true}})();
</script></body></html>
