<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101019">
<title>NR SHOP</title>
<link rel="stylesheet" href="studio.css">
<script src="studio.js" defer></script>
</head>
<body>
<main>
  <header class="masthead">
    <a class="brand" href="./" aria-label="پنل نمایندگی"><span class="brand-mark">N</span><strong dir="ltr">NR SHOP</strong></a>
    <span id="session">مدیریت</span>
  </header>
  <section id="intro" class="intro">
    <div class="intro-art" aria-hidden="true"><i></i><i></i><i></i></div>
    <p id="eyebrow">NR SHOP / ADMIN</p>
    <h1 id="title">داشبورد مدیریت</h1>
    <p id="summary">فروش، مشتری‌ها و نمایندگی را از همین‌جا مدیریت کن.</p>
  </section>
  <section id="operations" aria-labelledby="sectionTitle">
    <div class="section-head"><h2 id="sectionTitle">دسترسی سریع</h2><button id="shortcut" type="button" class="text-button">تنظیم چیدمان</button></div>
    <div id="screenCard" class="surface screen">
      <p id="caption" class="body" hidden></p>
      <div id="media"></div>
      <div id="buttons" class="action-grid"></div>
      <form id="form" hidden>
        <label for="value">متن یا مقدار</label>
        <textarea id="value" rows="3"></textarea>
        <input id="secret" type="password" hidden autocomplete="new-password" aria-label="رمز پنل">
        <input id="upload" type="file" accept="image/jpeg,image/png,application/pdf" hidden aria-label="فایل یا عکس">
        <div class="bar"><button class="primary">ارسال</button><button type="button" id="cancelForm">لغو فرم</button></div>
      </form>
    </div>
  </section>

  <section id="appearance" hidden aria-label="تنظیمات ظاهر">
    <div class="surface setting">
      <div class="section-head"><h2>مدل چیدمان</h2></div>
      <label for="layout">چیدمان مینی‌اپ</label>
      <select id="layout"></select>
      <label for="chat_layout">چیدمان دکمه‌های منوی ربات در تلگرام</label>
      <select id="chat_layout"></select>
      <div class="preview-label">پیش‌نمایش مینی‌اپ</div>
      <div id="layoutPreview" class="action-grid layout-preview"></div>
      <div class="preview-label">پیش‌نمایش چیدمان ربات</div>
      <div id="chatPreview" class="action-grid layout-preview"></div>
    </div>
    <div class="surface setting">
      <h2>تم مینی‌اپ</h2>
      <div id="presets" class="presets"></div>
      <div class="pair">
        <label>دکمهٔ اصلی<input id="primary" type="color"></label>
        <label>دکمه‌های منو<input id="secondary" type="color"></label>
        <label>پس‌زمینه<input id="background" type="color"></label>
        <label>کارت‌ها و فرم‌ها<input id="surface" type="color"></label>
      </div>
      <label for="native">رنگ پیش‌فرض دکمه‌ها در چت تلگرام</label>
      <select id="native"></select>
    </div>
    <div class="surface setting">
      <h2>رنگ هر دکمه</h2>
      <p class="muted">دکمه را از فهرست انتخاب کن. با باز کردن بخش‌های دیگر، دکمه‌های آن بخش هم به فهرست اضافه می‌شوند.</p>
      <label for="buttonSearch">جستجوی دکمه</label>
      <input id="buttonSearch" type="search" placeholder="مثلاً گزارش فروش">
      <label for="targetButton">انتخاب دکمه</label>
      <select id="targetButton"></select>
      <div class="pair">
        <label>رنگ مینی‌اپ<input id="buttonColor" type="color"></label>
        <label>رنگ چت تلگرام<select id="buttonNative"></select></label>
      </div>
      <div class="bar"><button id="buttonPreview" type="button">پیش‌نمایش دکمه</button><button id="clearButton" type="button" class="text-button">بازگشت به رنگ عمومی</button></div>
    </div>
    <div class="savebar"><button class="primary" id="save">ذخیرهٔ تنظیمات</button><button id="reset">تم اولیه</button></div>
  </section>
  <p id="notice" class="notice" role="status"></p>
</main>
<nav aria-label="منوی اصلی" id="dock">
  <button id="home" aria-current="page"><span aria-hidden="true">⌂</span> داشبورد</button>
  <button id="palette"><span aria-hidden="true">◈</span> ظاهر و چیدمان</button>
</nav>
</body>
</html>
